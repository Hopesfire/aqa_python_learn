name: Full CI Pipeline (Quality + Tests)

on: [push, pull_request]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install + Lint
        run: |
          pip install -r requirements.txt
          black --check .
          isort . --check-only --diff
          flake8 .
          mypy .

  test:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip + Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps
      - name: Run tests
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PASS: ${{ secrets.GH_PASS }}
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          REQRES_EMAIL: ${{ secrets.REQRES_EMAIL }}
          REQRES_PASSWORD: ${{ secrets.REQRES_PASSWORD }}
        run: pytest --alluredir=reports/allure
      - name: Copy Allure categories
        if: always()
        run: cp categories.json reports/allure/categories.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-python${{ matrix.python-version }}
          path: reports/allure
          retention-days: 30
